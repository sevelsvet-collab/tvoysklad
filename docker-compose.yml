services:
  db:
    image: postgres:16-alpine
    container_name: sklad-db   # уникальное имя, чтобы не путать с чужими "db" в общих сетях
    env_file: .env             # POSTGRES_DB/USER/PASSWORD берутся напрямую из .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/app/media:ro
      - caddy_data:/data       # сертификаты Let's Encrypt (сохраняются между перезапусками)
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  staticfiles:
  media:
  caddy_data:
  caddy_config:
