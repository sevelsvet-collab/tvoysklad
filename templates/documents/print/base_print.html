{% load humanize %}<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @page { size: {% block page_size %}A4 portrait{% endblock %}; margin: 1.2cm; }
  body { font-family: 'DejaVu', Arial, sans-serif; font-size: 9pt; color: #000; }
  table { border-collapse: collapse; width: 100%; }
  td, th { vertical-align: middle; }
  .b td, .b th { border: 0.75pt solid #000; padding: 2pt 4pt; }
  .small { font-size: 7.5pt; }
  .right { text-align: right; }
  .center { text-align: center; }
  .bold { font-weight: bold; }
  .muted { color: #444; }
  .title { font-size: 13pt; font-weight: bold; }
  .mt { margin-top: 10pt; }
  .mt2 { margin-top: 18pt; }
  .nowrap { white-space: nowrap; }
  .sign-img { height: 40pt; }
  .stamp-img { height: 90pt; }
  hr { border: none; border-top: 1pt solid #000; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
