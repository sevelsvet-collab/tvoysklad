<li>
  <a href="{% url 'product_list' %}?group={{ group.pk }}" class="{% if active_group == group.pk|stringformat:'s' %}active{% endif %}">
    <i class="bi bi-folder me-1"></i>{{ group.name }}
  </a>
  {% if group.children.all %}
  <ul>
    {% for child in group.children.all %}
      {% include "catalog/_group_node.html" with group=child %}
    {% endfor %}
  </ul>
  {% endif %}
</li>
