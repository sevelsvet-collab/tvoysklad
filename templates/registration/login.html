{% extends "base.html" %}
{% block title %}Вход — Склад{% endblock %}
{% block anonymous_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
  <div class="card shadow" style="width: 380px;">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1"><i class="bi bi-box-seam-fill text-primary me-2"></i>Склад</h1>
      <p class="text-muted text-center mb-4">Вход в систему</p>
      {% if form.errors %}
        <div class="alert alert-danger py-2">Неверный логин или пароль</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Логин</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Войти</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
